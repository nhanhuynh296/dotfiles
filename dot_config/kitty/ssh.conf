# kitten ssh settings. Matched against the host name typed on the command line.
# Colors reset when the ssh session ends.
# Last matching block wins (kittens/ssh/config.go, v0.50.0). Keep prod last.

hostname *
color_scheme ssh-dev.conf

hostname *uat*
color_scheme ssh-uat.conf

hostname *prod* *shared*
color_scheme ssh-prod.conf
